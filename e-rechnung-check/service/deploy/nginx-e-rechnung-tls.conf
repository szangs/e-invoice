# All-in-one: statische Teaser-Seite + KoSIT-Pruefdienst.
# HTTP-Block: Redirect auf HTTPS (+ ACME-Challenge).
# HTTPS-Block: die eigentliche Seite. TLS via Let's Encrypt.

server {
    listen 80;
    listen [::]:80;
    server_name e-rechnung-api.deltaplus.de e-rechnung.deltaplus.de;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name e-rechnung-api.deltaplus.de e-rechnung.deltaplus.de;

    ssl_certificate     /etc/letsencrypt/live/e-rechnung-api.deltaplus.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/e-rechnung-api.deltaplus.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/e-rechnung-check/public;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    location /api/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        client_max_body_size 20m;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8787/healthz;
        proxy_set_header Host $host;
    }
}
