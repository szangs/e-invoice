# All-in-one: statische Teaser-Seite + KoSIT-Prüfdienst auf einer Domain.
# Ablage: /etc/nginx/sites-available/e-rechnung  →  symlink nach sites-enabled/
# Danach:  certbot --nginx -d e-rechnung.deltaplus.de
#
# DNS: A-Record  e-rechnung.deltaplus.de  →  85.215.136.179

server {
    listen 80;
    listen [::]:80;
    server_name e-rechnung.deltaplus.de;

    # Statische Seite
    root /opt/e-rechnung-check/public;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }

    # KoSIT-Prüfdienst (gleiche Domain → kein CORS nötig)
    location /api/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        client_max_body_size 20m;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8787/healthz;
        proxy_set_header Host $host;
    }
}
