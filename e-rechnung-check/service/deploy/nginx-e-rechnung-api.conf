# Reverse-Proxy fuer den E-Rechnung-Check-Dienst.
# Ablage: /etc/nginx/sites-available/e-rechnung-api  →  symlink nach sites-enabled/
# Danach:  certbot --nginx -d e-rechnung-api.deltaplus.de
#
# DNS: A-Record  e-rechnung-api.deltaplus.de  →  85.215.136.179

server {
    listen 80;
    listen [::]:80;
    server_name e-rechnung-api.deltaplus.de;

    # Von certbot verwaltet; nach dem ersten Lauf ergaenzt certbot 443 + Redirect.
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Upload-Limit (Dienst begrenzt zusaetzlich per MAX_BYTES)
    client_max_body_size 20m;
}
